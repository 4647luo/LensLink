name: Replace LensLink 0.0.1 with signed build v2

on:
  push:
    paths:
      - '.github/workflows/replace-0.0.1-signing-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        run: curl -L --retry 3 --fail -o LensLink-0.0.1.apk 'https://aka.doubaocdn.com/s/W0PF2bvvbV'
      - name: Verify signed APK
        run: |
          ls -lh LensLink-0.0.1.apk
          sha256sum LensLink-0.0.1.apk
      - name: Update release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          target_commitish: main
          name: 连镜 LensLink 0.0.1
          overwrite_files: true
          body: |
            连镜 LensLink 首个公开版本（正式签名版）。

            - 尼康相机 Wi‑Fi / USB / 蓝牙连接
            - 实时监看、曝光参数、LUT、直方图、波形图、峰值与网格
            - 图库、RAW/JPG 下载、裁剪、曲线、滤镜与 LUT 编辑
            - 自动下载、锁定文件导入、蓝牙 GPS 推送与蓝牙遥控
            - App 内检查 GitHub 更新

            安装：下载 `LensLink-0.0.1.apk`，允许安装未知来源应用后安装。Android 10 及以上。

            已安装 0.0.1 debug 版的设备，请先卸载旧版再安装本正式签名版。

            SHA256：`51524E5A975CD7E94B185008C992E18EFBD86EE0CCEAA72016F1F6A6D17BDFC9`
          files: LensLink-0.0.1.apk
          draft: false
          prerelease: false
