name: Add README disclaimer

on:
  push:
    paths:
      - '.github/workflows/add-disclaimer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append disclaimer
        run: |
          if grep -q '^## 声明' README.md; then
            echo 'disclaimer already present'
            exit 0
          fi
          cat >> README.md <<'EOF'

          ---

          ## 声明

          连镜 LensLink 是个人开发的第三方工具，与尼康株式会社（Nikon Corporation）没有隶属、授权、赞助或背书关系。"Nikon""Z 系列"等名称与商标归其权利人所有，本项目仅用于说明兼容的相机型号。

          本软件按"现状"提供，不附带任何明示或暗示的保证。相机控制依赖厂商未公开的 PTP/IP 与蓝牙协议，不保证兼容所有机型、固件或后续固件更新；不同机型可用功能可能不同，部分操作可能导致拍摄中断、参数被修改、文件丢失或相机异常。使用本软件连接、控制相机及回传文件的风险由使用者自行承担；建议先在非重要拍摄场景测试，并保留原始文件备份。是否影响厂商保修，请以厂商条款为准。

          本软件不会把照片上传到任何服务器；图库、自动下载与锁定文件均在本机处理。GitHub 更新检查只读取公开的 Release 信息。

          使用前请确认你拥有所连接相机的合法使用权，并遵守当地法律法规。如果你不同意上述说明，请不要使用本软件。
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add disclaimer to README' || echo 'no changes to commit'
          git push
