name: Import Nikon PTP tools

on:
  push:
    paths:
      - '.github/workflows/import-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tools archive
        run: curl -L --retry 3 --fail -o tools.zip 'https://aka.doubaocdn.com/s/ZyQhAvHdgc'
      - name: Extract tools
        run: unzip -o tools.zip
      - name: Commit tools
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools
          git commit -m 'Add Nikon PTP/IP mock and probe tools' || echo 'no changes to commit'
          git push
