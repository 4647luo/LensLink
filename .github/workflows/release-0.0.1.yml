name: Publish LensLink 0.0.1

on:
  push:
    paths:
      - '.github/workflows/release-0.0.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: curl -L --retry 3 --fail -o LensLink-0.0.1.apk 'https://aka.doubaocdn.com/s/W9YPQqDgMO'
      - name: Verify APK
        run: |
          ls -lh LensLink-0.0.1.apk
          sha256sum LensLink-0.0.1.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          target_commitish: main
          name: 连镜 LensLink 0.0.1
          body: |
            连镜 LensLink 首个公开版本。

            - 尼康相机 Wi‑Fi / USB / 蓝牙连接
            - 实时监看、曝光参数、LUT、直方图、波形图、峰值与网格
            - 图库、RAW/JPG 下载、裁剪、曲线、滤镜与 LUT 编辑
            - 自动下载、锁定文件导入、蓝牙 GPS 推送与蓝牙遥控
            - App 内检查 GitHub 更新

            安装：下载 `LensLink-0.0.1.apk`，允许安装未知来源应用后安装。Android 10 及以上。

            SHA256：`2BD84D7757BA3D9A1C56F942CAABD0C903B4F1C85E0EDFFE87521366C0BD29DD`
          files: LensLink-0.0.1.apk
          draft: false
          prerelease: false
