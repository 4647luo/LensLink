name: Import LensLink source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared source archive
        run: curl -L --retry 3 --fail -o /tmp/source.zip 'https://aka.doubaocdn.com/s/WAVwL9ruYZ'
      - name: Unpack into repository
        run: |
          rm -rf /tmp/lenslink-src
          mkdir -p /tmp/lenslink-src
          unzip -q /tmp/source.zip -d /tmp/lenslink-src
          rsync -a --exclude='.git' /tmp/lenslink-src/ ./
      - name: Commit imported source
        run: |
          git config user.name 'LensLink Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import LensLink 0.0.1 source, docs and screenshots'
          git push
